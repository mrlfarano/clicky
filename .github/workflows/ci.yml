# Clicky CI: parity and the Windows port (phase 3, ADR 001).
#
# Runners: macos-latest and windows-latest (playbook requirement), plus
# ubuntu-latest, because ADR 001 acceptance 1 needs Clicky.Core.Tests green
# on Linux. The jobs differ too much to share one `strategy.matrix`, so each
# OS is its own job with a fixed name.
#
# CHECK NAMES ARE A CONTRACT. Branch protection requires them by name.
# Renaming a job silently drops it from the required checks.
#   macos-parity      golden-vector schema, worker build, parity-spec link lint
#   windows-build     build, Core tests, replay e2e, publish, (sign), vpk pack,
#                     assert-artifacts, Defender scan, installed-replay
#   linux-core-tests  Clicky.Core.Tests on Linux
#
# BRANCH PROTECTION cannot be configured from the repo. The owner sets it in
# Settings > Branches > main (or a ruleset targeting main):
#   - Require a pull request before merging.
#   - Require status checks to pass: macos-parity, windows-build, linux-core-tests.
#   - Require branches to be up to date before merging.
#   - Block force pushes (AGENTS.md: "Do not force-push to main").
#   - Block deletions.
# PHASE GATE: turn this on only after the first green run of the phase-3c tracer
# bullet. Until windows/ exists, windows-build and linux-core-tests fail, and
# requiring them would block every merge.

name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  macos-parity:
    name: macos-parity
    runs-on: macos-latest
    timeout-minutes: 20
    # Current scope: platform-neutral checks only.
    # TODO(phase that touches the Xcode project): add `xcodebuild test` here to
    # run the XCTest golden-vector file (point-tag, push-to-talk; ADR tracer item 7).
    # Running xcodebuild here is fine even though AGENTS.md forbids it. That rule
    # protects TCC grants (screen recording, accessibility) on a developer's own Mac.
    # A CI runner is an ephemeral VM with no grants to lose, and the XCTest
    # vectors never call a TCC-gated API.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Validate shared/golden vectors
        # Shape is defined in docs/02-parity-spec.md, "Golden vector file format".
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const goldenDirectory = 'shared/golden';
          const filesRequiredByTracerBullet = ['point-tag', 'screen-mapping', 'sse-stream', 'push-to-talk'];
          const failures = [];

          const countLines = (filePath) => {
            const lines = fs.readFileSync(filePath, 'utf8').split(/\r?\n/);
            if (lines[lines.length - 1] === '') lines.pop();
            return lines.length;
          };

          const vectorFiles = fs.existsSync(goldenDirectory)
            ? fs.readdirSync(goldenDirectory).filter((name) => name.endsWith('.json'))
            : [];
          for (const requiredName of filesRequiredByTracerBullet) {
            if (!vectorFiles.includes(`${requiredName}.json`)) {
              failures.push(`${goldenDirectory}/${requiredName}.json is missing (ADR 001 tracer item 7)`);
            }
          }

          for (const fileName of vectorFiles) {
            const filePath = path.join(goldenDirectory, fileName);
            const fail = (message) => failures.push(`${filePath}: ${message}`);
            let vectorDocument;
            try {
              vectorDocument = JSON.parse(fs.readFileSync(filePath, 'utf8'));
            } catch (parseError) {
              fail(`invalid JSON: ${parseError.message}`);
              continue;
            }
            if (vectorDocument.schema !== 1) fail('"schema" must be 1');
            for (const key of ['seam', 'swiftAnchor']) {
              if (typeof vectorDocument[key] !== 'string' || !vectorDocument[key].trim()) fail(`"${key}" must be a non-empty string`);
            }
            // swiftAnchor is "path:start[-end]". The Swift lines it cites must still exist.
            const anchorMatch = /^(.+?):(\d+)(?:-(\d+))?$/.exec(vectorDocument.swiftAnchor || '');
            if (!anchorMatch || !fs.existsSync(anchorMatch[1])) {
              fail(`"swiftAnchor" must be an existing file with a line range, got "${vectorDocument.swiftAnchor}"`);
            } else if (Number(anchorMatch[3] || anchorMatch[2]) > countLines(anchorMatch[1])) {
              fail(`"swiftAnchor" ${vectorDocument.swiftAnchor} is past the end of the file (Swift drifted?)`);
            }
            if (!Array.isArray(vectorDocument.cases) || vectorDocument.cases.length === 0) {
              fail('"cases" must be a non-empty array');
              continue;
            }
            const seenCaseIds = new Set();
            vectorDocument.cases.forEach((vectorCase, caseIndex) => {
              if (vectorCase === null || typeof vectorCase !== 'object' || typeof vectorCase.id !== 'string' || !vectorCase.id) {
                fail(`cases[${caseIndex}] needs a non-empty string "id"`);
                return;
              }
              if (seenCaseIds.has(vectorCase.id)) fail(`duplicate case id "${vectorCase.id}"`);
              seenCaseIds.add(vectorCase.id);
              if (!('input' in vectorCase) || !('expected' in vectorCase)) fail(`case "${vectorCase.id}" needs "input" and "expected"`);
            });
            console.log(`${filePath}: ${vectorDocument.cases.length} case(s)`);
          }

          if (failures.length) {
            failures.forEach((message) => console.log(`::error::${message}`));
            process.exit(1);
          }
          console.log(`golden vectors OK (${vectorFiles.length} file(s))`);
          EOF

      - name: Lint parity-spec links
        # Every relative markdown link in the spec must resolve, and #Lx[-Ly]
        # anchors must still be inside the file. This catches Swift line drift.
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const specPath = 'docs/02-parity-spec.md';
          const specText = fs.readFileSync(specPath, 'utf8');
          const failures = [];
          const lineCountByFile = new Map();
          const countLines = (filePath) => {
            if (!lineCountByFile.has(filePath)) {
              const lines = fs.readFileSync(filePath, 'utf8').split(/\r?\n/);
              if (lines[lines.length - 1] === '') lines.pop();
              lineCountByFile.set(filePath, lines.length);
            }
            return lineCountByFile.get(filePath);
          };

          let checkedLinkCount = 0;
          for (const [, linkTarget] of specText.matchAll(/\]\(([^)\s]+)\)/g)) {
            if (/^[a-z][a-z0-9+.-]*:/i.test(linkTarget) || linkTarget.startsWith('#')) continue;
            const [relativePath, anchor] = linkTarget.split('#');
            const resolvedPath = path.normalize(path.join(path.dirname(specPath), relativePath));
            checkedLinkCount++;
            if (!fs.existsSync(resolvedPath)) {
              failures.push(`${linkTarget} -> ${resolvedPath} does not exist`);
              continue;
            }
            const lineAnchor = /^L(\d+)(?:-L(\d+))?$/.exec(anchor || '');
            if (lineAnchor) {
              const lastCitedLine = Number(lineAnchor[2] || lineAnchor[1]);
              const fileLineCount = countLines(resolvedPath);
              if (lastCitedLine > fileLineCount) failures.push(`${linkTarget}: line ${lastCitedLine} > ${fileLineCount} lines in ${resolvedPath}`);
            }
          }

          if (failures.length) {
            failures.forEach((message) => console.log(`::error file=${specPath}::${message}`));
            process.exit(1);
          }
          console.log(`spec links OK (${checkedLinkCount} relative link(s) checked)`);
          EOF

      - name: Build worker
        working-directory: worker
        env:
          WRANGLER_SEND_METRICS: "false"
        # --dry-run bundles src/index.ts without deploying. It needs no Cloudflare credentials.
        run: |
          set -o pipefail
          mkdir -p ../artifacts
          npm ci
          npx wrangler deploy --dry-run --outdir ../artifacts/worker-dist 2>&1 | tee ../artifacts/worker-build.log

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: macos-parity-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn

  windows-build:
    name: windows-build
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        # Run dotnet from windows/ so windows/global.json (SDK 10.0.1xx pin) applies.
        working-directory: windows
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: |
          New-Item -ItemType Directory -Force ../artifacts/logs, ../artifacts/test-results, ../artifacts/package | Out-Null
          dotnet restore Clicky.slnx

      - name: Build
        run: dotnet build Clicky.slnx -c Release --no-restore "-bl:../artifacts/logs/build.binlog"

      - name: Clicky.Core.Tests
        run: dotnet test tests/Clicky.Core.Tests -c Release --no-build --logger "trx;LogFileName=core-tests.trx" --results-directory ../artifacts/test-results

      - name: Clicky.Windows.Tests (parity replay e2e)
        # Every test in this project drives `Clicky.exe --replay <shared/fixtures/sse/*.sse>`
        # (ADR tracer item 4). No secrets are passed to this job and appsettings.json
        # ships no WorkerBaseUrl, so a test that went live would fail instead of
        # spending Worker credits.
        run: dotnet test tests/Clicky.Windows.Tests -c Release --no-build --logger "trx;LogFileName=windows-tests.trx" --results-directory ../artifacts/test-results

      - name: Publish
        # Self-contained, so the artifact runs on the clean Win10 1903 acceptance VM
        # (ADR acceptance list), which has no .NET 10 runtime installed.
        run: dotnet publish src/Clicky.Windows -c Release -r win-x64 --self-contained true -o ../artifacts/publish "-bl:../artifacts/logs/publish.binlog"

      - name: Sign (phase-gated; no-op without SIGNING_* secrets)
        # Phase 5 provisions signing (ADR "Signing": Azure Trusted Signing preferred,
        # OV .pfx fallback). This step handles the .pfx fallback. Fork PRs never
        # receive secrets, so they always take the skip path.
        # TODO(phase 5): switch to the Trusted Signing dlib once the account exists,
        # and sign Setup.exe and the update packages as well.
        env:
          SIGNING_CERT_PFX_BASE64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if (-not $env:SIGNING_CERT_PFX_BASE64) {
            Write-Host "signing: SKIPPED - secret SIGNING_CERT_PFX_BASE64 is not set (expected before phase 5). Artifacts are unsigned."
            exit 0
          }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signing: signtool.exe not found under Windows Kits" }
          $pfxPath = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGNING_CERT_PFX_BASE64))
          try {
            & $signtool.FullName sign /f $pfxPath /p $env:SIGNING_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 ../artifacts/publish/Clicky.exe
            if ($LASTEXITCODE -ne 0) { throw "signing: signtool exited $LASTEXITCODE" }
            Write-Host "signing: Clicky.exe signed"
          } finally {
            Remove-Item $pfxPath -Force
          }

      - name: Package
        # Velopack `vpk pack` replaces the tracer-bullet zip (ADR 001 "Packaging":
        # Velopack primary, per-user Setup.exe, no MSIX).
        #
        # The vpk tool is PINNED to 1.2.161, the same version as the Velopack NuGet
        # reference in windows/src/Clicky.Windows/Clicky.Windows.csproj: the packer and
        # the app's VelopackApp hooks must agree on the package format.
        # PackagingWorkflowTests.PackUsesWinBetaChannelAndPinnedVpk fails the build if
        # the two pins drift apart.
        #
        # Version scheme: 0.1.0-ci.<run number>.
        #   - "0.1.0" is the Windows pre-release SemVer base; bump it here (and only
        #     here) when a beta cycle is cut.
        #   - "-ci.<run number>" makes every CI build a unique, monotonically increasing
        #     pre-release of that base on the win-beta channel, so later builds always
        #     sort newer than earlier ones without git tags.
        # --packDir is the win-x64 self-contained publish output, and --runtime win-x64
        # makes vpk's architecture explicit (without it vpk warns and assumes x86).
        # vpk's Setup.exe installs per-user into %LOCALAPPDATA% with no admin rights by
        # default (no --machine / --msi), which is what ADR 001 requires.
        run: |
          dotnet tool install -g vpk --version 1.2.161
          $packVersion = "0.1.0-ci.$env:GITHUB_RUN_NUMBER"
          vpk pack --packId Clicky --packVersion $packVersion --packTitle Clicky --runtime win-x64 `
            --channel win-beta --mainExe Clicky.exe `
            --packDir ../artifacts/publish --outputDir ../artifacts/package

      - name: assert-artifacts
        # Fails fast, before the Defender scan and the upload, unless vpk produced the
        # full win-beta release set (T-013): the per-user installer (vpk names it
        # '<packId>-<channel>-Setup.exe'), exactly one full .nupkg and the channel's
        # releases manifest.
        run: |
          $packageDirectory = "../artifacts/package"
          $setupExeFiles = @(Get-ChildItem (Join-Path $packageDirectory "*-Setup.exe"))
          if ($setupExeFiles.Count -ne 1) {
            Write-Host "::error::assert-artifacts: expected exactly one Setup.exe (*-Setup.exe) in $packageDirectory, found $($setupExeFiles.Count)"
            exit 1
          }
          $fullNupkgFiles = @(Get-ChildItem (Join-Path $packageDirectory "*-full.nupkg"))
          if ($fullNupkgFiles.Count -ne 1) {
            Write-Host "::error::assert-artifacts: expected exactly one full .nupkg in $packageDirectory, found $($fullNupkgFiles.Count)"
            exit 1
          }
          $releasesManifestPath = Join-Path $packageDirectory "releases.win-beta.json"
          if (-not (Test-Path $releasesManifestPath)) {
            Write-Host "::error::assert-artifacts: releases.win-beta.json is missing from $packageDirectory"
            exit 1
          }
          Write-Host "assert-artifacts: Setup.exe $([Math]::Round($setupExeFiles[0].Length / 1MB, 1)) MB ($($setupExeFiles[0].Name)), $($fullNupkgFiles[0].Name), releases.win-beta.json OK"

      - name: Defender scan of packaged output
        # MpCmdRun exit codes for `-Scan -ScanType 3 -DisableRemediation`:
        #   0      scan completed, no threats.
        #   2      threats found. -DisableRemediation means nothing is quarantined
        #          or cleaned, so 2 is the detection signal and the job fails.
        #   other  the scan did not complete (service off, bad path, aborted). That
        #          is NOT "clean", so it also fails, with a different message.
        # -DisableRemediation also makes the custom scan ignore Defender's file
        # exclusions and scan inside archives, so the runner image's exclusions
        # cannot turn this into a silent no-op.
        # ../artifacts/package now holds the Velopack output — the Setup.exe, the full
        # .nupkg (an archive the scan opens) and releases.win-beta.json — so both
        # packaged files T-013 names are covered, alongside the raw publish directory.
        run: |
          $mpCmdRun = Join-Path $env:ProgramFiles "Windows Defender\MpCmdRun.exe"
          if (-not (Test-Path $mpCmdRun)) { throw "defender: MpCmdRun.exe not found at $mpCmdRun" }
          & $mpCmdRun -SignatureUpdate
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::defender: signature update exited $LASTEXITCODE; scanning with the image's existing signatures" }
          Get-MpComputerStatus | Format-List AMServiceEnabled, AntivirusEnabled, AntivirusSignatureVersion, AntivirusSignatureLastUpdated
          $failed = $false
          foreach ($scanTarget in @("../artifacts/publish", "../artifacts/package")) {
            $scanPath = (Resolve-Path $scanTarget).Path
            Write-Host "defender: scanning $scanPath"
            & $mpCmdRun -Scan -ScanType 3 -DisableRemediation -File $scanPath
            $scanExitCode = $LASTEXITCODE
            switch ($scanExitCode) {
              0 { Write-Host "defender: $scanPath clean (exit 0)" }
              2 { Write-Host "::error::defender: THREAT DETECTED in $scanPath (exit 2)"; $failed = $true }
              default { Write-Host "::error::defender: scan of $scanPath did not complete (exit $scanExitCode); result is unknown, not clean"; $failed = $true }
            }
          }
          if ($failed) { exit 1 }

      - name: installed-replay
        # T-014 / WS-08 part 2: smoke-test the INSTALLED copy, not the build output.
        # Sits after the Defender scan so nothing executes before it has been scanned,
        # and before the upload so a failure is visible in the uploaded artifacts' logs.
        #
        # Velopack behavior this step depends on (observed locally with vpk 1.2.161,
        # the pinned version, by running the generated Setup.exe):
        #   - Setup.exe --silent (shown by 'Setup.exe --help' as '-s, --silent: Hides
        #     all dialogs and answers yes to all prompts') does a FULL install that
        #     replaces the whole %LOCALAPPDATA%\Clicky root — it deletes settings.json,
        #     logs\ and crashes\ beside current\, on a same-version rerun and on a newer
        #     version alike.
        #   - The staged update apply ('Update.exe apply -s --norestart -p <full.nupkg>',
        #     the command UpdateManager.ApplyUpdates runs) replaces only current\ and
        #     leaves everything beside it untouched.
        # The user-data assertion therefore applies the second package through
        # Update.exe: that is the update path users ride, and the path WS-08 requires
        # to preserve user data. Re-running Setup.exe instead would wipe it.
        #
        # The replay fixture is passed as an absolute path from the checkout: the exe
        # resolves --replay purely via Path.GetFullPath + File.Exists
        # (ClickyCommandLineOptions), so it needs nothing repo-shaped beside the
        # install and the installed copy stays honest.
        run: |
          $ErrorActionPreference = 'Stop'

          $setupExecutableFiles = @(Get-ChildItem "../artifacts/package/*-Setup.exe")
          if ($setupExecutableFiles.Count -ne 1) {
            Write-Host "::error::installed-replay: expected exactly one Setup.exe in ../artifacts/package, found $($setupExecutableFiles.Count)"
            exit 1
          }
          $setupExecutablePath = $setupExecutableFiles[0].FullName
          $velopackRootDirectory = Join-Path $env:LOCALAPPDATA "Clicky"
          $installedCurrentDirectory = Join-Path $velopackRootDirectory "current"
          $installedClickyExecutablePath = Join-Path $installedCurrentDirectory "Clicky.exe"

          # 1) Silent install of the package the Package step just built.
          $firstSilentInstallProcess = Start-Process -FilePath $setupExecutablePath -ArgumentList "--silent" -PassThru -Wait
          if ($firstSilentInstallProcess.ExitCode -ne 0) {
            Write-Host "::error::installed-replay: silent install of $setupExecutablePath exited $($firstSilentInstallProcess.ExitCode)"
            exit 1
          }
          if (-not (Test-Path $installedClickyExecutablePath)) {
            Write-Host "::error::installed-replay: silent install did not create $installedClickyExecutablePath"
            exit 1
          }

          # 2) Seed the user data WS-08 keeps beside current\: settings.json (the ADR
          #    settings location; WS-12 persists it for real), and sentinel files under
          #    logs\ and crashes\. The replay run below appends real entries to logs\.
          Set-Content -Path (Join-Path $velopackRootDirectory "settings.json") -Value '{"updateChannel":"win-beta"}'
          New-Item -ItemType Directory -Force (Join-Path $velopackRootDirectory "logs"), (Join-Path $velopackRootDirectory "crashes") | Out-Null
          Set-Content -Path (Join-Path $velopackRootDirectory "logs/clicky-installed-replay-seed.log") -Value "seed log line that must survive a package apply"
          Set-Content -Path (Join-Path $velopackRootDirectory "crashes/installed-replay-seed.txt") -Value "seed crash report that must survive a package apply"

          # 3) Run the INSTALLED Clicky.exe in replay mode and require exit 0 plus the
          #    report on disk (a run that silently skipped replay would produce neither).
          $replayFixturePath = (Resolve-Path "../shared/fixtures/sse/point-basic.sse").Path
          $replayReportPath = Join-Path $env:RUNNER_TEMP "installed-replay-report.json"
          Remove-Item $replayReportPath -Force -ErrorAction SilentlyContinue
          $installedReplayProcess = Start-Process -FilePath $installedClickyExecutablePath -ArgumentList @("--replay", $replayFixturePath, "--report", $replayReportPath) -PassThru -Wait
          if ($installedReplayProcess.ExitCode -ne 0) {
            Write-Host "::error::installed-replay: installed Clicky.exe --replay point-basic.sse exited $($installedReplayProcess.ExitCode)"
            exit 1
          }
          if (-not (Test-Path $replayReportPath)) {
            Write-Host "::error::installed-replay: installed Clicky.exe wrote no report at $replayReportPath"
            exit 1
          }

          # 4) Snapshot the user data, then apply a SECOND package through the update
          #    path. The second version appends '.1' to the Package step's version so it
          #    sorts newer on the win-beta channel, and it packs into RUNNER_TEMP so
          #    ../artifacts/package keeps exactly the one release set assert-artifacts
          #    validated and the upload step ships.
          function Get-UserDataFileState {
            $userDataEntries = @(Get-Item -LiteralPath (Join-Path $velopackRootDirectory "settings.json"))
            $userDataEntries += Get-ChildItem -LiteralPath (Join-Path $velopackRootDirectory "logs"), (Join-Path $velopackRootDirectory "crashes") -Recurse -File
            $userDataEntries | ForEach-Object {
              "{0}={1}" -f $_.FullName, (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash
            }
          }
          $userDataStateBeforeSecondApply = @(Get-UserDataFileState)

          $secondPackageVersion = "0.1.0-ci.$env:GITHUB_RUN_NUMBER.1"
          $secondPackageDirectory = Join-Path $env:RUNNER_TEMP "clicky-second-package"
          vpk pack --packId Clicky --packVersion $secondPackageVersion --packTitle Clicky --runtime win-x64 `
            --channel win-beta --mainExe Clicky.exe `
            --packDir ../artifacts/publish --outputDir $secondPackageDirectory
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::installed-replay: second vpk pack (version $secondPackageVersion) exited $LASTEXITCODE"
            exit 1
          }
          $secondFullNupkgFiles = @(Get-ChildItem (Join-Path $secondPackageDirectory "*-full.nupkg"))
          if ($secondFullNupkgFiles.Count -ne 1) {
            Write-Host "::error::installed-replay: expected exactly one full .nupkg for version $secondPackageVersion, found $($secondFullNupkgFiles.Count)"
            exit 1
          }

          # --norestart keeps Update.exe from launching the app afterward: live mode
          # would install the keyboard hook and wait for Ctrl+C, hanging the job.
          $installedUpdateExecutablePath = Join-Path $velopackRootDirectory "Update.exe"
          $secondApplyProcess = Start-Process -FilePath $installedUpdateExecutablePath -ArgumentList @("apply", "-s", "--norestart", "-p", $secondFullNupkgFiles[0].FullName) -PassThru -Wait
          if ($secondApplyProcess.ExitCode -ne 0) {
            Write-Host "::error::installed-replay: second package apply via Update.exe exited $($secondApplyProcess.ExitCode)"
            exit 1
          }
          if (-not (Test-Path $installedClickyExecutablePath)) {
            Write-Host "::error::installed-replay: second package apply removed $installedClickyExecutablePath"
            exit 1
          }
          # current\sq.version reporting the second version proves the apply really
          # replaced current\ rather than exiting 0 as a silent no-op.
          $installedVersionManifestText = Get-Content (Join-Path $installedCurrentDirectory "sq.version") -Raw
          if ($installedVersionManifestText -notmatch [Regex]::Escape($secondPackageVersion)) {
            Write-Host "::error::installed-replay: current\sq.version does not report the second package version $secondPackageVersion, so the apply did not take effect"
            exit 1
          }

          # 5) The user data beside current\ must be byte-identical after the apply:
          #    no file added, removed or modified.
          $userDataStateAfterSecondApply = @(Get-UserDataFileState)
          $userDataDifferences = @(Compare-Object -ReferenceObject $userDataStateBeforeSecondApply -DifferenceObject $userDataStateAfterSecondApply)
          if ($userDataDifferences.Count -gt 0) {
            $userDataDifferences | ForEach-Object { Write-Host "::error::installed-replay: user data beside current\ did not survive the second package apply: $($_.InputObject) ($($_.SideIndicator))" }
            exit 1
          }
          Write-Host "installed-replay: silent install OK, installed --replay point-basic.sse exited 0, second package $secondPackageVersion applied, $($userDataStateAfterSecondApply.Count) user-data file(s) beside current\ byte-identical"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: windows-build-${{ github.run_attempt }}
          # publish/ is packed inside the Velopack full .nupkg, so the package dir
          # (Setup.exe, .nupkg, releases.win-beta.json), logs and test results are enough.
          path: |
            artifacts/logs/
            artifacts/test-results/
            artifacts/package/
          if-no-files-found: warn

  linux-core-tests:
    name: linux-core-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Clicky.Core.Tests
        # Clicky.Core and its tests target plain net10.0 with no Windows references (ADR layout).
        run: dotnet test tests/Clicky.Core.Tests -c Release --logger "trx;LogFileName=core-tests-linux.trx" --results-directory ../artifacts/test-results

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: linux-core-tests-${{ github.run_attempt }}
          path: artifacts/test-results/
