# Clicky CI: parity and the Windows port (phase 3, ADR 001).
#
# Runners: macos-latest and windows-latest (playbook requirement), plus
# ubuntu-latest, because ADR 001 acceptance 1 needs Clicky.Core.Tests green
# on Linux. The jobs differ too much to share one `strategy.matrix`, so each
# OS is its own job with a fixed name.
#
# CHECK NAMES ARE A CONTRACT. Branch protection requires them by name.
# Renaming a job silently drops it from the required checks.
#   macos-parity      golden-vector schema, worker build, parity-spec link lint
#   windows-build     build, Core tests, replay e2e, publish, sign (secret-gated),
#                     vpk pack, assert-artifacts, verify-signature, Defender scan,
#                     installed-replay, update-n-to-n1
#   linux-core-tests  Clicky.Core.Tests on Linux
#   release-gate      win-v* tags only: refuses a non-beta tag or unsigned binaries.
#   windows-release   win-v* tags only, after release-gate: vpk upload github of
#                     windows-build's package. Both are skipped on every other run,
#                     so neither is a required check.
#
# BRANCH PROTECTION cannot be configured from the repo. The owner sets it in
# Settings > Branches > main (or a ruleset targeting main):
#   - Require a pull request before merging.
#   - Require status checks to pass: macos-parity, windows-build, linux-core-tests.
#   - Require branches to be up to date before merging.
#   - Block force pushes (AGENTS.md: "Do not force-push to main").
#   - Block deletions.
# PHASE GATE: turn this on only after the first green run of the phase-3c tracer
# bullet. Until windows/ exists, windows-build and linux-core-tests fail, and
# requiring them would block every merge.

name: CI

on:
  push:
    # Branch pushes as before, plus the win-v* tags that publish a Windows release
    # (windows-release). Listing tags here limits tag runs to win-v*.
    branches: ['**']
    tags: ['win-v*']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  macos-parity:
    name: macos-parity
    runs-on: macos-latest
    timeout-minutes: 20
    # Current scope: platform-neutral checks only.
    # TODO(phase that touches the Xcode project): add `xcodebuild test` here to
    # run the XCTest golden-vector file (point-tag, push-to-talk; ADR tracer item 7).
    # Running xcodebuild here is fine even though AGENTS.md forbids it. That rule
    # protects TCC grants (screen recording, accessibility) on a developer's own Mac.
    # A CI runner is an ephemeral VM with no grants to lose, and the XCTest
    # vectors never call a TCC-gated API.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Validate shared/golden vectors
        # Shape is defined in docs/02-parity-spec.md, "Golden vector file format".
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const goldenDirectory = 'shared/golden';
          const filesRequiredByTracerBullet = ['point-tag', 'screen-mapping', 'sse-stream', 'push-to-talk'];
          const failures = [];

          const countLines = (filePath) => {
            const lines = fs.readFileSync(filePath, 'utf8').split(/\r?\n/);
            if (lines[lines.length - 1] === '') lines.pop();
            return lines.length;
          };

          const vectorFiles = fs.existsSync(goldenDirectory)
            ? fs.readdirSync(goldenDirectory).filter((name) => name.endsWith('.json'))
            : [];
          for (const requiredName of filesRequiredByTracerBullet) {
            if (!vectorFiles.includes(`${requiredName}.json`)) {
              failures.push(`${goldenDirectory}/${requiredName}.json is missing (ADR 001 tracer item 7)`);
            }
          }

          for (const fileName of vectorFiles) {
            const filePath = path.join(goldenDirectory, fileName);
            const fail = (message) => failures.push(`${filePath}: ${message}`);
            let vectorDocument;
            try {
              vectorDocument = JSON.parse(fs.readFileSync(filePath, 'utf8'));
            } catch (parseError) {
              fail(`invalid JSON: ${parseError.message}`);
              continue;
            }
            if (vectorDocument.schema !== 1) fail('"schema" must be 1');
            for (const key of ['seam', 'swiftAnchor']) {
              if (typeof vectorDocument[key] !== 'string' || !vectorDocument[key].trim()) fail(`"${key}" must be a non-empty string`);
            }
            // swiftAnchor is "path:start[-end]". The Swift lines it cites must still exist.
            const anchorMatch = /^(.+?):(\d+)(?:-(\d+))?$/.exec(vectorDocument.swiftAnchor || '');
            if (!anchorMatch || !fs.existsSync(anchorMatch[1])) {
              fail(`"swiftAnchor" must be an existing file with a line range, got "${vectorDocument.swiftAnchor}"`);
            } else if (Number(anchorMatch[3] || anchorMatch[2]) > countLines(anchorMatch[1])) {
              fail(`"swiftAnchor" ${vectorDocument.swiftAnchor} is past the end of the file (Swift drifted?)`);
            }
            if (!Array.isArray(vectorDocument.cases) || vectorDocument.cases.length === 0) {
              fail('"cases" must be a non-empty array');
              continue;
            }
            const seenCaseIds = new Set();
            vectorDocument.cases.forEach((vectorCase, caseIndex) => {
              if (vectorCase === null || typeof vectorCase !== 'object' || typeof vectorCase.id !== 'string' || !vectorCase.id) {
                fail(`cases[${caseIndex}] needs a non-empty string "id"`);
                return;
              }
              if (seenCaseIds.has(vectorCase.id)) fail(`duplicate case id "${vectorCase.id}"`);
              seenCaseIds.add(vectorCase.id);
              if (!('input' in vectorCase) || !('expected' in vectorCase)) fail(`case "${vectorCase.id}" needs "input" and "expected"`);
            });
            console.log(`${filePath}: ${vectorDocument.cases.length} case(s)`);
          }

          if (failures.length) {
            failures.forEach((message) => console.log(`::error::${message}`));
            process.exit(1);
          }
          console.log(`golden vectors OK (${vectorFiles.length} file(s))`);
          EOF

      - name: Lint parity-spec links
        # Every relative markdown link in the spec must resolve, and #Lx[-Ly]
        # anchors must still be inside the file. This catches Swift line drift.
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const specPath = 'docs/02-parity-spec.md';
          const specText = fs.readFileSync(specPath, 'utf8');
          const failures = [];
          const lineCountByFile = new Map();
          const countLines = (filePath) => {
            if (!lineCountByFile.has(filePath)) {
              const lines = fs.readFileSync(filePath, 'utf8').split(/\r?\n/);
              if (lines[lines.length - 1] === '') lines.pop();
              lineCountByFile.set(filePath, lines.length);
            }
            return lineCountByFile.get(filePath);
          };

          let checkedLinkCount = 0;
          for (const [, linkTarget] of specText.matchAll(/\]\(([^)\s]+)\)/g)) {
            if (/^[a-z][a-z0-9+.-]*:/i.test(linkTarget) || linkTarget.startsWith('#')) continue;
            const [relativePath, anchor] = linkTarget.split('#');
            const resolvedPath = path.normalize(path.join(path.dirname(specPath), relativePath));
            checkedLinkCount++;
            if (!fs.existsSync(resolvedPath)) {
              failures.push(`${linkTarget} -> ${resolvedPath} does not exist`);
              continue;
            }
            const lineAnchor = /^L(\d+)(?:-L(\d+))?$/.exec(anchor || '');
            if (lineAnchor) {
              const lastCitedLine = Number(lineAnchor[2] || lineAnchor[1]);
              const fileLineCount = countLines(resolvedPath);
              if (lastCitedLine > fileLineCount) failures.push(`${linkTarget}: line ${lastCitedLine} > ${fileLineCount} lines in ${resolvedPath}`);
            }
          }

          if (failures.length) {
            failures.forEach((message) => console.log(`::error file=${specPath}::${message}`));
            process.exit(1);
          }
          console.log(`spec links OK (${checkedLinkCount} relative link(s) checked)`);
          EOF

      - name: Build worker
        working-directory: worker
        env:
          WRANGLER_SEND_METRICS: "false"
        # --dry-run bundles src/index.ts without deploying. It needs no Cloudflare credentials.
        run: |
          set -o pipefail
          mkdir -p ../artifacts
          npm ci
          npx wrangler deploy --dry-run --outdir ../artifacts/worker-dist 2>&1 | tee ../artifacts/worker-build.log

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: macos-parity-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn

  windows-build:
    name: windows-build
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      # windows-release refuses to publish an unsigned package.
      signing-mode: ${{ steps.sign.outputs.mode }}
    defaults:
      run:
        shell: pwsh
        # Run dotnet from windows/ so windows/global.json (SDK 10.0.1xx pin) applies.
        working-directory: windows
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: |
          New-Item -ItemType Directory -Force ../artifacts/logs, ../artifacts/test-results, ../artifacts/package | Out-Null
          dotnet restore Clicky.slnx

      - name: Build
        run: dotnet build Clicky.slnx -c Release --no-restore "-bl:../artifacts/logs/build.binlog"

      - name: Clicky.Core.Tests
        run: dotnet test tests/Clicky.Core.Tests -c Release --no-build --logger "trx;LogFileName=core-tests.trx" --results-directory ../artifacts/test-results

      - name: Clicky.Windows.Tests (parity replay e2e)
        # Every test in this project drives `Clicky.exe --replay <shared/fixtures/sse/*.sse>`
        # (ADR tracer item 4). No secrets are passed to this job and appsettings.json
        # ships no WorkerBaseUrl, so a test that went live would fail instead of
        # spending Worker credits.
        run: dotnet test tests/Clicky.Windows.Tests -c Release --no-build --logger "trx;LogFileName=windows-tests.trx" --results-directory ../artifacts/test-results

      - name: Publish
        # Self-contained, so the artifact runs on the clean Win10 1903 acceptance VM
        # (ADR acceptance list), which has no .NET 10 runtime installed.
        run: dotnet publish src/Clicky.Windows -c Release -r win-x64 --self-contained true -o ../artifacts/publish "-bl:../artifacts/logs/publish.binlog"

      - name: Sign
        id: sign
        # T-015 / WS-09: picks how the Package step's `vpk pack` signs Clicky.exe (and the
        # other unsigned binaries in the publish output), Update.exe and Setup.exe. vpk
        # signs while it packs, so the .nupkg and Setup.exe carry the signed binaries, and
        # it runs before verify-signature, the Defender scan and installed-replay.
        # vpk 1.2.161 bundles its own signtool.exe and the Trusted Signing dlib
        # (vendor/signing), so no Windows SDK lookup on the runner is needed.
        #
        # SECRETS CONTRACT (repository secrets; fork PRs receive none):
        #   Azure Trusted Signing, primary. All six are required:
        #     TRUSTED_SIGNING_ENDPOINT             account endpoint, e.g. https://eus.codesigning.azure.net/
        #     TRUSTED_SIGNING_ACCOUNT_NAME         Trusted Signing account name
        #     TRUSTED_SIGNING_CERTIFICATE_PROFILE  certificate profile name
        #     AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET
        #                                          app registration holding the Certificate
        #                                          Profile Signer role on that profile; the
        #                                          dlib's DefaultAzureCredential reads them
        #   OV certificate, fallback when Trusted Signing is not configured. Both required:
        #     SIGNING_CERT_PFX_BASE64              the .pfx, base64-encoded
        #     SIGNING_PASSWORD                     the .pfx password
        #   Repository VARIABLE (not a secret), read by verify-signature:
        #     SIGNING_EXPECTED_SUBJECT             the signer certificate's full Subject string
        # Timestamps: Trusted Signing uses http://timestamp.acs.microsoft.com (built into
        # vpk); the OV path uses http://timestamp.digicert.com.
        #
        # With none of these secrets the step logs `signing: SKIPPED` and the job stays
        # green with unsigned output. A half-configured path fails instead, so a missing
        # or misspelled secret cannot silently ship unsigned binaries.
        env:
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.TRUSTED_SIGNING_ACCOUNT_NAME }}
          TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SIGNING_CERT_PFX_BASE64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          $trustedSigningSecretNames = @('TRUSTED_SIGNING_ENDPOINT', 'TRUSTED_SIGNING_ACCOUNT_NAME', 'TRUSTED_SIGNING_CERTIFICATE_PROFILE', 'AZURE_TENANT_ID', 'AZURE_CLIENT_ID', 'AZURE_CLIENT_SECRET')
          $ovCertificateSecretNames = @('SIGNING_CERT_PFX_BASE64', 'SIGNING_PASSWORD')
          $configuredTrustedSigningSecretNames = @($trustedSigningSecretNames | Where-Object { [Environment]::GetEnvironmentVariable($_) })
          $configuredOvCertificateSecretNames = @($ovCertificateSecretNames | Where-Object { [Environment]::GetEnvironmentVariable($_) })

          if ($configuredTrustedSigningSecretNames.Count -eq $trustedSigningSecretNames.Count) {
            # The metadata file vpk hands to the dlib via `signtool /dmdf`.
            @{
              Endpoint = $env:TRUSTED_SIGNING_ENDPOINT
              CodeSigningAccountName = $env:TRUSTED_SIGNING_ACCOUNT_NAME
              CertificateProfileName = $env:TRUSTED_SIGNING_CERTIFICATE_PROFILE
            } | ConvertTo-Json | Set-Content -Path (Join-Path $env:RUNNER_TEMP "trusted-signing-metadata.json")
            "mode=trusted-signing" >> $env:GITHUB_OUTPUT
            Write-Host "signing: Azure Trusted Signing"
          } elseif ($configuredTrustedSigningSecretNames.Count -gt 0) {
            $missingSecretNames = $trustedSigningSecretNames | Where-Object { $_ -notin $configuredTrustedSigningSecretNames }
            Write-Host "::error::signing: Trusted Signing is partially configured; missing secret(s): $($missingSecretNames -join ', ')"
            exit 1
          } elseif ($configuredOvCertificateSecretNames.Count -eq $ovCertificateSecretNames.Count) {
            [IO.File]::WriteAllBytes((Join-Path $env:RUNNER_TEMP "signing.pfx"), [Convert]::FromBase64String($env:SIGNING_CERT_PFX_BASE64))
            "mode=ov-certificate" >> $env:GITHUB_OUTPUT
            Write-Host "signing: OV certificate"
          } elseif ($configuredOvCertificateSecretNames.Count -gt 0) {
            $missingSecretNames = $ovCertificateSecretNames | Where-Object { $_ -notin $configuredOvCertificateSecretNames }
            Write-Host "::error::signing: OV certificate is partially configured; missing secret(s): $($missingSecretNames -join ', ')"
            exit 1
          } else {
            "mode=skipped" >> $env:GITHUB_OUTPUT
            Write-Host "signing: SKIPPED"
            Write-Host "::notice::No signing secrets are set (every fork PR, and this repo until the owner provisions them). Artifacts are unsigned."
            exit 0
          }

      - name: Package
        # Velopack `vpk pack` replaces the tracer-bullet zip (ADR 001 "Packaging":
        # Velopack primary, per-user Setup.exe, no MSIX).
        #
        # The vpk tool is PINNED to 1.2.161, the same version as the Velopack NuGet
        # reference in windows/src/Clicky.Windows/Clicky.Windows.csproj: the packer and
        # the app's VelopackApp hooks must agree on the package format.
        # PackagingWorkflowTests.PackUsesWinBetaChannelAndPinnedVpk fails the build if
        # the two pins drift apart.
        #
        # Version scheme: 0.1.0-ci.<run number>.
        #   - "0.1.0" is the Windows pre-release SemVer base; bump it here (and only
        #     here) when a beta cycle is cut.
        #   - "-ci.<run number>" makes every CI build a unique, monotonically increasing
        #     pre-release of that base on the win-beta channel, so later builds always
        #     sort newer than earlier ones without git tags.
        # --packDir is the win-x64 self-contained publish output, and --runtime win-x64
        # makes vpk's architecture explicit (without it vpk warns and assumes x86).
        # vpk's Setup.exe installs per-user into %LOCALAPPDATA% with no admin rights by
        # default (no --machine / --msi), which is what ADR 001 requires.
        #
        # Signing (mode chosen by the Sign step): Trusted Signing passes vpk the metadata
        # file; the OV path passes `signtool sign` parameters for the .pfx. Skipped mode
        # passes neither, so the pack is unsigned.
        env:
          SIGNING_MODE: ${{ steps.sign.outputs.mode }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          dotnet tool install -g vpk --version 1.2.161
          $packVersion = "0.1.0-ci.$env:GITHUB_RUN_NUMBER"
          $pfxPath = Join-Path $env:RUNNER_TEMP "signing.pfx"
          $vpkSigningArguments = @(switch ($env:SIGNING_MODE) {
            'trusted-signing' { '--azureTrustedSignFile', (Join-Path $env:RUNNER_TEMP "trusted-signing-metadata.json") }
            'ov-certificate' { '--signParams', "/f `"$pfxPath`" /p `"$env:SIGNING_PASSWORD`" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256" }
          })
          vpk pack --packId Clicky --packVersion $packVersion --packTitle Clicky --runtime win-x64 `
            --channel win-beta --mainExe Clicky.exe `
            --packDir ../artifacts/publish --outputDir ../artifacts/package @vpkSigningArguments
          $vpkPackExitCode = $LASTEXITCODE
          Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          if ($vpkPackExitCode -ne 0) {
            Write-Host "::error::Package: vpk pack exited $vpkPackExitCode"
            exit $vpkPackExitCode
          }

      - name: assert-artifacts
        # Fails fast, before the Defender scan and the upload, unless vpk produced the
        # full win-beta release set (T-013): the per-user installer (vpk names it
        # '<packId>-<channel>-Setup.exe'), exactly one full .nupkg and the channel's
        # releases manifest.
        run: |
          $packageDirectory = "../artifacts/package"
          $setupExeFiles = @(Get-ChildItem (Join-Path $packageDirectory "*-Setup.exe"))
          if ($setupExeFiles.Count -ne 1) {
            Write-Host "::error::assert-artifacts: expected exactly one Setup.exe (*-Setup.exe) in $packageDirectory, found $($setupExeFiles.Count)"
            exit 1
          }
          $fullNupkgFiles = @(Get-ChildItem (Join-Path $packageDirectory "*-full.nupkg"))
          if ($fullNupkgFiles.Count -ne 1) {
            Write-Host "::error::assert-artifacts: expected exactly one full .nupkg in $packageDirectory, found $($fullNupkgFiles.Count)"
            exit 1
          }
          $releasesManifestPath = Join-Path $packageDirectory "releases.win-beta.json"
          if (-not (Test-Path $releasesManifestPath)) {
            Write-Host "::error::assert-artifacts: releases.win-beta.json is missing from $packageDirectory"
            exit 1
          }
          Write-Host "assert-artifacts: Setup.exe $([Math]::Round($setupExeFiles[0].Length / 1MB, 1)) MB ($($setupExeFiles[0].Name)), $($fullNupkgFiles[0].Name), releases.win-beta.json OK"

      - name: verify-signature
        # T-015: runs whenever the Sign step signed (skipped builds are unsigned by
        # design). Each of the three shipped binaries must have Status Valid, a
        # timestamp countersignature and the signer Subject the owner configured.
        # Setup.exe is read from the package output; Clicky.exe and Update.exe from
        # inside the full .nupkg, because that is what Setup.exe installs and the update
        # path applies. vpk stores Update.exe in the package under its legacy name
        # Squirrel.exe, so either name is accepted.
        if: steps.sign.outputs.mode != 'skipped'
        env:
          SIGNING_EXPECTED_SUBJECT: ${{ vars.SIGNING_EXPECTED_SUBJECT }}
        run: |
          if (-not $env:SIGNING_EXPECTED_SUBJECT) {
            Write-Host "::error::verify-signature: repository variable SIGNING_EXPECTED_SUBJECT is not set"
            exit 1
          }
          $packageDirectory = "../artifacts/package"
          $extractedFullNupkgDirectory = Join-Path $env:RUNNER_TEMP "verify-signature-full-nupkg"
          $fullNupkgPath = (Get-ChildItem (Join-Path $packageDirectory "*-full.nupkg") | Select-Object -First 1).FullName
          # ZipFile, not Expand-Archive: Expand-Archive rejects a non-.zip extension.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::ExtractToDirectory($fullNupkgPath, $extractedFullNupkgDirectory, $true)

          $filesByBinaryName = [ordered]@{
            'Clicky.exe' = @(Get-ChildItem $extractedFullNupkgDirectory -Recurse -File -Include Clicky.exe)
            'Update.exe' = @(Get-ChildItem $extractedFullNupkgDirectory -Recurse -File -Include Update.exe, Squirrel.exe)
            'Setup.exe' = @(Get-ChildItem (Join-Path $packageDirectory "*-Setup.exe"))
          }
          $failed = $false
          foreach ($binaryName in $filesByBinaryName.Keys) {
            $binaryFiles = $filesByBinaryName[$binaryName]
            if ($binaryFiles.Count -ne 1) {
              Write-Host "::error::verify-signature: expected exactly one $binaryName, found $($binaryFiles.Count)"
              $failed = $true
              continue
            }
            $signature = Get-AuthenticodeSignature -LiteralPath $binaryFiles[0].FullName
            $signerSubject = $signature.SignerCertificate.Subject
            $binarySignatureProblems = @()
            if ($signature.Status -ne 'Valid') { $binarySignatureProblems += "status is $($signature.Status) ($($signature.StatusMessage)), expected Valid" }
            if ($null -eq $signature.TimeStamperCertificate) { $binarySignatureProblems += "has no timestamp (TimeStamperCertificate is null)" }
            if ($signerSubject -ne $env:SIGNING_EXPECTED_SUBJECT) { $binarySignatureProblems += "signer subject is '$signerSubject', expected '$env:SIGNING_EXPECTED_SUBJECT'" }
            $binarySignatureProblems | ForEach-Object { Write-Host "::error::verify-signature: $binaryName $_" }
            if ($binarySignatureProblems.Count -gt 0) { $failed = $true } else { Write-Host "verify-signature: $binaryName Valid, timestamped by $($signature.TimeStamperCertificate.Subject), signed by $signerSubject" }
          }
          if ($failed) { exit 1 }

      - name: Defender scan of packaged output
        # MpCmdRun exit codes for `-Scan -ScanType 3 -DisableRemediation`:
        #   0      scan completed, no threats.
        #   2      threats found. -DisableRemediation means nothing is quarantined
        #          or cleaned, so 2 is the detection signal and the job fails.
        #   other  the scan did not complete (service off, bad path, aborted). That
        #          is NOT "clean", so it also fails, with a different message.
        # -DisableRemediation also makes the custom scan ignore Defender's file
        # exclusions and scan inside archives, so the runner image's exclusions
        # cannot turn this into a silent no-op.
        # ../artifacts/package now holds the Velopack output — the Setup.exe, the full
        # .nupkg (an archive the scan opens) and releases.win-beta.json — so both
        # packaged files T-013 names are covered, alongside the raw publish directory.
        run: |
          $mpCmdRun = Join-Path $env:ProgramFiles "Windows Defender\MpCmdRun.exe"
          if (-not (Test-Path $mpCmdRun)) { throw "defender: MpCmdRun.exe not found at $mpCmdRun" }
          & $mpCmdRun -SignatureUpdate
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::defender: signature update exited $LASTEXITCODE; scanning with the image's existing signatures" }
          Get-MpComputerStatus | Format-List AMServiceEnabled, AntivirusEnabled, AntivirusSignatureVersion, AntivirusSignatureLastUpdated
          $failed = $false
          foreach ($scanTarget in @("../artifacts/publish", "../artifacts/package")) {
            $scanPath = (Resolve-Path $scanTarget).Path
            Write-Host "defender: scanning $scanPath"
            & $mpCmdRun -Scan -ScanType 3 -DisableRemediation -File $scanPath
            $scanExitCode = $LASTEXITCODE
            switch ($scanExitCode) {
              0 { Write-Host "defender: $scanPath clean (exit 0)" }
              2 { Write-Host "::error::defender: THREAT DETECTED in $scanPath (exit 2)"; $failed = $true }
              default { Write-Host "::error::defender: scan of $scanPath did not complete (exit $scanExitCode); result is unknown, not clean"; $failed = $true }
            }
          }
          if ($failed) { exit 1 }

      - name: installed-replay
        # T-014 / WS-08 part 2: smoke-test the INSTALLED copy, not the build output.
        # Sits after the Defender scan so nothing executes before it has been scanned,
        # and before the upload so a failure is visible in the uploaded artifacts' logs.
        #
        # Velopack behavior this step depends on (observed locally with vpk 1.2.161,
        # the pinned version, by running the generated Setup.exe):
        #   - Setup.exe --silent (shown by 'Setup.exe --help' as '-s, --silent: Hides
        #     all dialogs and answers yes to all prompts') does a FULL install that
        #     replaces the whole %LOCALAPPDATA%\Clicky root — it deletes settings.json,
        #     logs\ and crashes\ beside current\, on a same-version rerun and on a newer
        #     version alike.
        #   - The staged update apply ('Update.exe apply -s --norestart -p <full.nupkg>',
        #     the command UpdateManager.ApplyUpdates runs) replaces only current\ and
        #     leaves everything beside it untouched.
        # The user-data assertion therefore applies the second package through
        # Update.exe: that is the update path users ride, and the path WS-08 requires
        # to preserve user data. Re-running Setup.exe instead would wipe it.
        #
        # The replay fixture is passed as an absolute path from the checkout: the exe
        # resolves --replay purely via Path.GetFullPath + File.Exists
        # (ClickyCommandLineOptions), so it needs nothing repo-shaped beside the
        # install and the installed copy stays honest.
        run: |
          $ErrorActionPreference = 'Stop'

          $setupExecutableFiles = @(Get-ChildItem "../artifacts/package/*-Setup.exe")
          if ($setupExecutableFiles.Count -ne 1) {
            Write-Host "::error::installed-replay: expected exactly one Setup.exe in ../artifacts/package, found $($setupExecutableFiles.Count)"
            exit 1
          }
          $setupExecutablePath = $setupExecutableFiles[0].FullName
          $velopackRootDirectory = Join-Path $env:LOCALAPPDATA "Clicky"
          $installedCurrentDirectory = Join-Path $velopackRootDirectory "current"
          $installedClickyExecutablePath = Join-Path $installedCurrentDirectory "Clicky.exe"

          # 1) Silent install of the package the Package step just built.
          $firstSilentInstallProcess = Start-Process -FilePath $setupExecutablePath -ArgumentList "--silent" -PassThru -Wait
          if ($firstSilentInstallProcess.ExitCode -ne 0) {
            Write-Host "::error::installed-replay: silent install of $setupExecutablePath exited $($firstSilentInstallProcess.ExitCode)"
            exit 1
          }
          if (-not (Test-Path $installedClickyExecutablePath)) {
            Write-Host "::error::installed-replay: silent install did not create $installedClickyExecutablePath"
            exit 1
          }

          # 2) Seed the user data WS-08 keeps beside current\: settings.json (the ADR
          #    settings location; WS-12 persists it for real), and sentinel files under
          #    logs\ and crashes\. The replay run below appends real entries to logs\.
          Set-Content -Path (Join-Path $velopackRootDirectory "settings.json") -Value '{"updateChannel":"win-beta"}'
          New-Item -ItemType Directory -Force (Join-Path $velopackRootDirectory "logs"), (Join-Path $velopackRootDirectory "crashes") | Out-Null
          Set-Content -Path (Join-Path $velopackRootDirectory "logs/clicky-installed-replay-seed.log") -Value "seed log line that must survive a package apply"
          Set-Content -Path (Join-Path $velopackRootDirectory "crashes/installed-replay-seed.txt") -Value "seed crash report that must survive a package apply"

          # 3) Run the INSTALLED Clicky.exe in replay mode and require exit 0 plus the
          #    report on disk (a run that silently skipped replay would produce neither).
          $replayFixturePath = (Resolve-Path "../shared/fixtures/sse/point-basic.sse").Path
          $replayReportPath = Join-Path $env:RUNNER_TEMP "installed-replay-report.json"
          Remove-Item $replayReportPath -Force -ErrorAction SilentlyContinue
          $installedReplayProcess = Start-Process -FilePath $installedClickyExecutablePath -ArgumentList @("--replay", $replayFixturePath, "--report", $replayReportPath) -PassThru -Wait
          if ($installedReplayProcess.ExitCode -ne 0) {
            Write-Host "::error::installed-replay: installed Clicky.exe --replay point-basic.sse exited $($installedReplayProcess.ExitCode)"
            exit 1
          }
          if (-not (Test-Path $replayReportPath)) {
            Write-Host "::error::installed-replay: installed Clicky.exe wrote no report at $replayReportPath"
            exit 1
          }

          # 4) Snapshot the user data, then apply a SECOND package through the update
          #    path. The second version appends '.1' to the Package step's version so it
          #    sorts newer on the win-beta channel, and it packs into RUNNER_TEMP so
          #    ../artifacts/package keeps exactly the one release set assert-artifacts
          #    validated and the upload step ships.
          function Get-UserDataFileState {
            $userDataEntries = @(Get-Item -LiteralPath (Join-Path $velopackRootDirectory "settings.json"))
            $userDataEntries += Get-ChildItem -LiteralPath (Join-Path $velopackRootDirectory "logs"), (Join-Path $velopackRootDirectory "crashes") -Recurse -File
            $userDataEntries | ForEach-Object {
              "{0}={1}" -f $_.FullName, (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash
            }
          }
          $userDataStateBeforeSecondApply = @(Get-UserDataFileState)

          $secondPackageVersion = "0.1.0-ci.$env:GITHUB_RUN_NUMBER.1"
          $secondPackageDirectory = Join-Path $env:RUNNER_TEMP "clicky-second-package"
          vpk pack --packId Clicky --packVersion $secondPackageVersion --packTitle Clicky --runtime win-x64 `
            --channel win-beta --mainExe Clicky.exe `
            --packDir ../artifacts/publish --outputDir $secondPackageDirectory
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::installed-replay: second vpk pack (version $secondPackageVersion) exited $LASTEXITCODE"
            exit 1
          }
          $secondFullNupkgFiles = @(Get-ChildItem (Join-Path $secondPackageDirectory "*-full.nupkg"))
          if ($secondFullNupkgFiles.Count -ne 1) {
            Write-Host "::error::installed-replay: expected exactly one full .nupkg for version $secondPackageVersion, found $($secondFullNupkgFiles.Count)"
            exit 1
          }

          # --norestart keeps Update.exe from launching the app afterward: live mode
          # would install the keyboard hook and wait for Ctrl+C, hanging the job.
          $installedUpdateExecutablePath = Join-Path $velopackRootDirectory "Update.exe"
          $secondApplyProcess = Start-Process -FilePath $installedUpdateExecutablePath -ArgumentList @("apply", "-s", "--norestart", "-p", $secondFullNupkgFiles[0].FullName) -PassThru -Wait
          if ($secondApplyProcess.ExitCode -ne 0) {
            Write-Host "::error::installed-replay: second package apply via Update.exe exited $($secondApplyProcess.ExitCode)"
            exit 1
          }
          if (-not (Test-Path $installedClickyExecutablePath)) {
            Write-Host "::error::installed-replay: second package apply removed $installedClickyExecutablePath"
            exit 1
          }
          # current\sq.version reporting the second version proves the apply really
          # replaced current\ rather than exiting 0 as a silent no-op.
          $installedVersionManifestText = Get-Content (Join-Path $installedCurrentDirectory "sq.version") -Raw
          if ($installedVersionManifestText -notmatch [Regex]::Escape($secondPackageVersion)) {
            Write-Host "::error::installed-replay: current\sq.version does not report the second package version $secondPackageVersion, so the apply did not take effect"
            exit 1
          }

          # 5) The user data beside current\ must be byte-identical after the apply:
          #    no file added, removed or modified.
          $userDataStateAfterSecondApply = @(Get-UserDataFileState)
          $userDataDifferences = @(Compare-Object -ReferenceObject $userDataStateBeforeSecondApply -DifferenceObject $userDataStateAfterSecondApply)
          if ($userDataDifferences.Count -gt 0) {
            $userDataDifferences | ForEach-Object { Write-Host "::error::installed-replay: user data beside current\ did not survive the second package apply: $($_.InputObject) ($($_.SideIndicator))" }
            exit 1
          }
          Write-Host "installed-replay: silent install OK, installed --replay point-basic.sse exited 0, second package $secondPackageVersion applied, $($userDataStateAfterSecondApply.Count) user-data file(s) beside current\ byte-identical"

      - name: update-n-to-n1
        # T-036 / WS-10 part 2: the installed app updates ITSELF. installed-replay drives
        # Update.exe by hand; here the installed Clicky.exe finds N+1 on a feed through
        # ClickyUpdateService + Velopack's UpdateManager (--debug-update-now) and applies it.
        #
        # N is the Package step's release; N+1 repacks the same publish output with a higher
        # version into a LOCAL directory feed that also holds N's release set (vpk then adds
        # an N -> N+1 delta and lists both in releases.win-beta.json). Velopack reads a plain
        # directory path as a feed (SimpleFileSource), so no server is needed. The feed lives
        # in RUNNER_TEMP so ../artifacts/package keeps exactly the release set that ships.
        #
        # The install root is removed first: installed-replay left N+1 of its own there, and
        # a fresh install of N must not depend on Setup.exe's downgrade behavior. The feed URL
        # goes into the INSTALLED copy's appsettings.json, the file ClickySettings reads next
        # to the exe. --debug-update-now exits once the release is handed to Velopack, and
        # Update.exe applies it after the process is gone, so the step polls sq.version.
        run: |
          $ErrorActionPreference = 'Stop'

          $velopackRootDirectory = Join-Path $env:LOCALAPPDATA "Clicky"
          $installedCurrentDirectory = Join-Path $velopackRootDirectory "current"
          $installedClickyExecutablePath = Join-Path $installedCurrentDirectory "Clicky.exe"
          $installedVersionManifestPath = Join-Path $installedCurrentDirectory "sq.version"
          $userSettingsFilePath = Join-Path $velopackRootDirectory "settings.json"
          function Write-UpdateDiagnostics {
            # Clicky's own log and Velopack's updater log are where a failed update explains itself.
            Get-ChildItem -LiteralPath $velopackRootDirectory -Recurse -File -Include clicky-*.log, *velopack*.log -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "--- $($_.FullName)"; Get-Content -LiteralPath $_.FullName -Tail 40 }
          }

          # 1) Fresh silent install of N (the Package step's Setup.exe).
          if (Test-Path $velopackRootDirectory) { Remove-Item -LiteralPath $velopackRootDirectory -Recurse -Force }
          $setupExecutablePath = @(Get-ChildItem "../artifacts/package/*-Setup.exe")[0].FullName
          $installProcess = Start-Process -FilePath $setupExecutablePath -ArgumentList "--silent" -PassThru -Wait
          if ($installProcess.ExitCode -ne 0 -or -not (Test-Path $installedClickyExecutablePath)) {
            Write-Host "::error::update-n-to-n1: silent install of N exited $($installProcess.ExitCode) or did not create $installedClickyExecutablePath"
            exit 1
          }
          $versionN = "0.1.0-ci.$env:GITHUB_RUN_NUMBER"
          if ((Get-Content $installedVersionManifestPath -Raw) -notmatch [Regex]::Escape($versionN)) {
            Write-Host "::error::update-n-to-n1: the fresh install does not report version N ($versionN)"
            exit 1
          }

          # 2) Seed the user's settings.json beside current\ and hash it.
          Set-Content -Path $userSettingsFilePath -Value '{"selectedClaudeModel":"claude-opus-4-6","hasCompletedOnboarding":true}'
          $settingsHashBeforeUpdate = (Get-FileHash -LiteralPath $userSettingsFilePath -Algorithm SHA256).Hash

          # 3) Local directory feed holding N and N+1.
          $versionN1 = "$versionN.2"
          $localFeedDirectory = Join-Path $env:RUNNER_TEMP "clicky-update-feed"
          New-Item -ItemType Directory -Force $localFeedDirectory | Out-Null
          Copy-Item -Path "../artifacts/package/*" -Destination $localFeedDirectory
          vpk pack --packId Clicky --packVersion $versionN1 --packTitle Clicky --runtime win-x64 `
            --channel win-beta --mainExe Clicky.exe `
            --packDir ../artifacts/publish --outputDir $localFeedDirectory
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::update-n-to-n1: vpk pack of N+1 ($versionN1) into the local feed exited $LASTEXITCODE"
            exit 1
          }
          $feedReleaseVersions = @((Get-Content (Join-Path $localFeedDirectory "releases.win-beta.json") -Raw | ConvertFrom-Json).Assets.Version)
          if ($versionN -notin $feedReleaseVersions -or $versionN1 -notin $feedReleaseVersions) {
            Write-Host "::error::update-n-to-n1: the local feed lists $($feedReleaseVersions -join ', '), expected both $versionN and $versionN1"
            exit 1
          }

          # 4) Point the installed copy at the local feed.
          $installedAppSettingsPath = Join-Path $installedCurrentDirectory "appsettings.json"
          $installedAppSettings = Get-Content $installedAppSettingsPath -Raw | ConvertFrom-Json
          $installedAppSettings.UpdateFeedUrl = $localFeedDirectory
          $installedAppSettings | ConvertTo-Json -Depth 10 | Set-Content -Path $installedAppSettingsPath

          # 5) The installed app checks, downloads and hands N+1 to Velopack, then exits 0.
          $debugUpdateProcess = Start-Process -FilePath $installedClickyExecutablePath -ArgumentList "--debug-update-now" -PassThru -Wait
          if ($debugUpdateProcess.ExitCode -ne 0) {
            Write-UpdateDiagnostics
            Write-Host "::error::update-n-to-n1: installed Clicky.exe --debug-update-now exited $($debugUpdateProcess.ExitCode)"
            exit 1
          }

          # 6) The installed version becomes N+1 once Update.exe has applied it.
          $applyDeadline = (Get-Date).AddMinutes(2)
          # SilentlyContinue: current\ is briefly missing while Update.exe swaps it.
          while (-not ((Get-Content $installedVersionManifestPath -Raw -ErrorAction SilentlyContinue) -match [Regex]::Escape($versionN1))) {
            if ((Get-Date) -gt $applyDeadline) {
              Write-UpdateDiagnostics
              Write-Host "::error::update-n-to-n1: current\sq.version never reported N+1 ($versionN1) within 2 minutes of --debug-update-now"
              exit 1
            }
            Start-Sleep -Seconds 2
          }
          Get-Process -Name Update -ErrorAction SilentlyContinue | Wait-Process -Timeout 60 -ErrorAction SilentlyContinue

          # 7) settings.json must be byte-identical across the self-update.
          $settingsHashAfterUpdate = (Get-FileHash -LiteralPath $userSettingsFilePath -Algorithm SHA256).Hash
          if ($settingsHashAfterUpdate -ne $settingsHashBeforeUpdate) {
            Write-Host "::error::update-n-to-n1: settings.json changed across the update (SHA256 $settingsHashBeforeUpdate -> $settingsHashAfterUpdate)"
            exit 1
          }
          Write-Host "update-n-to-n1: installed $versionN updated itself to $versionN1 via --debug-update-now from $localFeedDirectory; settings.json SHA256 $settingsHashAfterUpdate unchanged"

      - name: install-hooks
        # T-034 / WS-20: the per-user install hooks, end to end on the real installer.
        #   - Run\Clicky (start at login, audit row A3) is written by ClickyInstallHooks from
        #     Velopack's after-install hook and deleted from its before-uninstall hook.
        #   - The Start-menu shortcut is Velopack's own: vpk pack's default --shortcuts
        #     Desktop,StartMenuRoot, named after --packTitle. Velopack's uninstall removes the
        #     shortcuts it created.
        # Both are per-user (HKCU, %APPDATA%) and Setup.exe installs into %LOCALAPPDATA%, so no
        # elevation is involved; the HKLM check proves nothing landed machine-wide. (The hosted
        # runner account is itself an admin, so this proves per-user targets, not a UAC prompt.)
        #
        # Starts from a clean slate: the earlier steps installed too, and update-n-to-n1 deletes
        # its install root by hand, which leaves its Run value and shortcut behind; a leftover
        # must not satisfy the "created" assertions. The update reuses installed-replay's
        # second package (RUNNER_TEMP\clicky-second-package, a newer version than N).
        run: |
          $ErrorActionPreference = 'Stop'

          $velopackRootDirectory = Join-Path $env:LOCALAPPDATA "Clicky"
          $installedCurrentDirectory = Join-Path $velopackRootDirectory "current"
          $installedClickyExecutablePath = Join-Path $installedCurrentDirectory "Clicky.exe"
          $runRegistryKeyPath = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          # The stable exe path (current\ keeps its name across updates), quoted as ClickyInstallHooks writes it.
          $expectedRunValue = "`"$installedClickyExecutablePath`""
          $startMenuShortcutPath = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Clicky.lnk"
          function Get-ClickyRunValue { (Get-ItemProperty -Path $runRegistryKeyPath -ErrorAction SilentlyContinue).Clicky }

          # 1) Clean slate.
          Get-Process -Name Clicky -ErrorAction SilentlyContinue | Stop-Process -Force
          if (Test-Path $velopackRootDirectory) { Remove-Item -LiteralPath $velopackRootDirectory -Recurse -Force }
          Remove-ItemProperty -Path $runRegistryKeyPath -Name "Clicky" -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $startMenuShortcutPath -Force -ErrorAction SilentlyContinue

          # 2) Silent install: the Run value points at the stable exe path and the shortcut exists.
          $setupExecutablePath = @(Get-ChildItem "../artifacts/package/*-Setup.exe")[0].FullName
          $installProcess = Start-Process -FilePath $setupExecutablePath -ArgumentList "--silent" -PassThru -Wait
          if ($installProcess.ExitCode -ne 0 -or -not (Test-Path $installedClickyExecutablePath)) {
            Write-Host "::error::install-hooks: silent install exited $($installProcess.ExitCode) or did not create $installedClickyExecutablePath"
            exit 1
          }
          $runValueAfterInstall = Get-ClickyRunValue
          if ($runValueAfterInstall -ne $expectedRunValue) {
            Write-Host "::error::install-hooks: HKCU Run\Clicky after install is '$runValueAfterInstall', expected '$expectedRunValue'"
            exit 1
          }
          if ($null -ne (Get-ItemProperty -Path "HKLM:\Software\Microsoft\Windows\CurrentVersion\Run" -ErrorAction SilentlyContinue).Clicky) {
            Write-Host "::error::install-hooks: the install wrote a machine-wide HKLM Run\Clicky value; start-at-login must be per-user"
            exit 1
          }
          if (-not (Test-Path $startMenuShortcutPath)) {
            Get-ChildItem (Split-Path $startMenuShortcutPath) -Filter *.lnk | ForEach-Object { Write-Host "start menu: $($_.Name)" }
            Write-Host "::error::install-hooks: the install did not create the Start-menu shortcut $startMenuShortcutPath"
            exit 1
          }

          # 3) Update through Update.exe apply (the path users ride); the Run value must be unchanged.
          $secondFullNupkgFiles = @(Get-ChildItem (Join-Path $env:RUNNER_TEMP "clicky-second-package/*-full.nupkg"))
          if ($secondFullNupkgFiles.Count -ne 1) {
            Write-Host "::error::install-hooks: expected installed-replay's second full .nupkg in RUNNER_TEMP\clicky-second-package, found $($secondFullNupkgFiles.Count)"
            exit 1
          }
          $secondPackageVersion = "0.1.0-ci.$env:GITHUB_RUN_NUMBER.1"
          $updateExecutablePath = Join-Path $velopackRootDirectory "Update.exe"
          $applyProcess = Start-Process -FilePath $updateExecutablePath -ArgumentList @("apply", "-s", "--norestart", "-p", $secondFullNupkgFiles[0].FullName) -PassThru -Wait
          if ($applyProcess.ExitCode -ne 0 -or (Get-Content (Join-Path $installedCurrentDirectory "sq.version") -Raw) -notmatch [Regex]::Escape($secondPackageVersion)) {
            Write-Host "::error::install-hooks: Update.exe apply of $secondPackageVersion exited $($applyProcess.ExitCode) or current\sq.version does not report it"
            exit 1
          }
          $runValueAfterUpdate = Get-ClickyRunValue
          if ($runValueAfterUpdate -ne $runValueAfterInstall) {
            Write-Host "::error::install-hooks: HKCU Run\Clicky changed across the update ('$runValueAfterInstall' -> '$runValueAfterUpdate')"
            exit 1
          }

          # 4) Silent uninstall: the Run value and the shortcut are both removed.
          $uninstallProcess = Start-Process -FilePath $updateExecutablePath -ArgumentList @("uninstall", "-s") -PassThru -Wait
          if ($uninstallProcess.ExitCode -ne 0) {
            Write-Host "::error::install-hooks: silent uninstall (Update.exe uninstall -s) exited $($uninstallProcess.ExitCode)"
            exit 1
          }
          $runValueAfterUninstall = Get-ClickyRunValue
          if ($null -ne $runValueAfterUninstall) {
            Write-Host "::error::install-hooks: HKCU Run\Clicky survived the uninstall ('$runValueAfterUninstall')"
            exit 1
          }
          if (Test-Path $startMenuShortcutPath) {
            Write-Host "::error::install-hooks: the Start-menu shortcut $startMenuShortcutPath survived the uninstall"
            exit 1
          }
          Write-Host "install-hooks: install wrote Run\Clicky=$runValueAfterInstall and $startMenuShortcutPath; unchanged across the $secondPackageVersion update; uninstall removed both"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: windows-build-${{ github.run_attempt }}
          # publish/ is packed inside the Velopack full .nupkg, so the package dir
          # (Setup.exe, .nupkg, releases.win-beta.json), logs and test results are enough.
          path: |
            artifacts/logs/
            artifacts/test-results/
            artifacts/package/
          if-no-files-found: warn

  release-gate:
    name: release-gate
    # T-037 / WS-21: a win-v<semver>-beta.N tag publishes only signed output to win-beta.
    # This job reads the exact package windows-build uploaded and fails unless every shipped
    # binary carries a Valid Authenticode signature, so a tag build without signing secrets
    # (every fork) stops here and windows-release, which needs this job, never uploads.
    # verify-signature in windows-build already checked timestamp and subject whenever it signed.
    if: startsWith(github.ref, 'refs/tags/win-v')
    needs: windows-build
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Download windows-build package
        uses: actions/download-artifact@v5
        with:
          name: windows-build-${{ github.run_attempt }}
          path: artifacts

      - name: Refuse unsigned output
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^win-v\d+\.\d+\.\d+-beta\.\d+$') {
            Write-Host "::error::release-gate: tag '$env:GITHUB_REF_NAME' is not win-v<semver>-beta.N; only beta tags publish, to the win-beta channel"
            exit 1
          }
          $packageDirectory = "artifacts/package"
          $extractedFullNupkgDirectory = Join-Path $env:RUNNER_TEMP "release-gate-full-nupkg"
          $fullNupkgFiles = @(Get-ChildItem (Join-Path $packageDirectory "*-full.nupkg"))
          if ($fullNupkgFiles.Count -ne 1) {
            Write-Host "::error::release-gate: expected exactly one full .nupkg in $packageDirectory, found $($fullNupkgFiles.Count)"
            exit 1
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::ExtractToDirectory($fullNupkgFiles[0].FullName, $extractedFullNupkgDirectory, $true)

          $filesByBinaryName = [ordered]@{
            'Clicky.exe' = @(Get-ChildItem $extractedFullNupkgDirectory -Recurse -File -Include Clicky.exe)
            'Update.exe' = @(Get-ChildItem $extractedFullNupkgDirectory -Recurse -File -Include Update.exe, Squirrel.exe)
            'Setup.exe' = @(Get-ChildItem (Join-Path $packageDirectory "*-Setup.exe"))
          }
          $failed = $false
          foreach ($binaryName in $filesByBinaryName.Keys) {
            $binaryFiles = $filesByBinaryName[$binaryName]
            if ($binaryFiles.Count -ne 1) {
              Write-Host "::error::release-gate: expected exactly one $binaryName, found $($binaryFiles.Count)"
              $failed = $true
              continue
            }
            $signatureStatus = (Get-AuthenticodeSignature -LiteralPath $binaryFiles[0].FullName).Status
            if ($signatureStatus -ne 'Valid') {
              Write-Host "::error::release-gate: $binaryName signature is $signatureStatus, refusing to upload unsigned output. Set the signing secrets listed under SECRETS CONTRACT in the windows-build Sign step of ci.yml (Trusted Signing or the OV .pfx) and re-run the tag."
              $failed = $true
            } else {
              Write-Host "release-gate: $binaryName Valid"
            }
          }
          if ($failed) { exit 1 }

          # windows-release uploads with --channel win-beta; the package must hold that channel's
          # release set and no other.
          $releasesManifestNames = @(Get-ChildItem (Join-Path $packageDirectory "releases.*.json") | ForEach-Object Name)
          if (($releasesManifestNames -join ',') -ne 'releases.win-beta.json') {
            Write-Host "::error::release-gate: expected only releases.win-beta.json in $packageDirectory, found '$($releasesManifestNames -join ', ')'"
            exit 1
          }
          Write-Host "release-gate: signed; target channel win-beta"

  windows-release:
    name: windows-release
    # T-036 / WS-10: a win-v* tag runs pack -> sign -> upload. windows-build packs and signs
    # (the Sign step picks the mode, the Package step's vpk pack signs, verify-signature checks
    # it) and tests the result (installed-replay, update-n-to-n1); this job only uploads that
    # exact package, so nothing is repacked between test and release. It is its own job so
    # contents: write reaches the upload alone, never the build and test steps.
    # The feed is GitHub Releases on this repo (VelopackUpdateFeedClient's GithubSource), on
    # the win-beta channel as GitHub prereleases. Only Velopack's win-beta files are uploaded:
    # the Mac Sparkle feed is built and pushed by the Mac release script on a Mac, never here.
    # shortcut: the release keeps windows-build's 0.1.0-ci.<run> package version (monotonic,
    # so the updater orders it right) rather than the tag's semver; derive it from the tag
    # when WS-21 cuts real betas.
    # release-gate (T-037) must pass first: it refuses unsigned binaries before this job starts.
    if: startsWith(github.ref, 'refs/tags/win-v')
    needs: [windows-build, release-gate]
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Download windows-build package
        uses: actions/download-artifact@v5
        with:
          name: windows-build-${{ github.run_attempt }}
          path: artifacts

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: vpk upload github
        env:
          SIGNING_MODE: ${{ needs.windows-build.outputs.signing-mode }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ($env:SIGNING_MODE -notin @('trusted-signing', 'ov-certificate')) {
            Write-Host "::error::windows-release: refusing to publish $env:GITHUB_REF_NAME unsigned (signing mode '$env:SIGNING_MODE'); configure the signing secrets"
            exit 1
          }
          dotnet tool install -g vpk --version 1.2.161
          vpk upload github --outputDir artifacts/package --channel win-beta `
            --repoUrl "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY" --token $env:GITHUB_TOKEN `
            --tag $env:GITHUB_REF_NAME --releaseName "Clicky for Windows $env:GITHUB_REF_NAME" --pre --publish
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::windows-release: vpk upload github exited $LASTEXITCODE"
            exit $LASTEXITCODE
          }

  linux-core-tests:
    name: linux-core-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Clicky.Core.Tests
        # Clicky.Core and its tests target plain net10.0 with no Windows references (ADR layout).
        run: dotnet test tests/Clicky.Core.Tests -c Release --logger "trx;LogFileName=core-tests-linux.trx" --results-directory ../artifacts/test-results

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: linux-core-tests-${{ github.run_attempt }}
          path: artifacts/test-results/
          if-no-files-found: warn
